<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} {% endblock %}</title>

    <!-- bootstrap cdn link  -->
     <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
</head>
<body>
    <!-- header -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand badge text-bg-success" href="#">Devsign-shop</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="{% url 'home-page' %}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="{% url 'product-page' %}">Products</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Cart</a>
        </li>
      </ul>
      <div class="d-flex gap-3">
        <a href="#" class="btn btn-danger">Login</a>
        <a href="{% url 'register' %}" class="btn btn-info">Register</a>
        <a href="#" class="btn btn-warning">Logout</a>
      </div>
    </div>
  </div>
</nav>
<!-- header end  -->
    <!-- main-content -->
    <div class="container-fluid" style="min-height: 75vh">
        {% block main-content %}

        {% endblock %}
    </div>
    <!-- main-content end -->
    <!-- footer -->
    <div class="container-fluid text-bg-dark">
        <footer class="py-3 mt-4">
            <ul class="nav justify-content-center border-bottom pb-3 mb-3">
                <li class="nav-item"><a href="#" class="nav-link px-2  text-white">Home</a></li>
                <li class="nav-item"><a href="#" class="nav-link px-2  text-white">Pricing</a></li>
                <li class="nav-item"><a href="#" class="nav-link px-2  text-white">Features</a></li>
                <li class="nav-item"><a href="#" class="nav-link px-2  text-white">FAQs</a></li>
                <li class="nav-item"><a href="#" class="nav-link px-2  text-white">About</a></li>
            </ul>
            <p class="text-center">&copy; 2026, Devsign shop</p>
        </footer>
    </div>
    <!-- bootstrap js cdn link  -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
