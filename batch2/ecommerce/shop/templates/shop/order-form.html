<!DOCTYPE html>
{% extends "user-layout.html" %}
{% load crispy_forms_tags %}

{% block page_title %}
User || Order Form
{% endblock %}

{% block main-content %}


<div class="d-flex justify-content-center">
    <div class="col-md-6">
        <h1>Order Form</h1>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3">
                {{ form|crispy }}
            </div>
           <button type="submit" class="btn btn-primary">submit</button>
        </form>
    </div>
</div>

{% endblock %}
