<!doctype html>
{% load static %}
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block page_title %} {% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <!-- bootstrap cdn link -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <div class="container-fluid">
    <div class="row">
      <div class="col-md-2 text-bg-dark py-4" style="height: 100vh;">
      <aside class="d-flex flex-column" style="height: 100%;">
          <div class="badge text-bg-success">
          Online-shop
        </div>

        <div class="flex-grow-1 my-5">
          <ul class="list-unstyled">
            <li class="px-4 py-2 rounded my-2" role="button">
              <a href="{% url 'dashboard' %}" class="text-white text-decoration-none">Dashboard</a>
            </li>
            <li class="px-4 py-2 rounded my-4" role="button">
              <a href="{% url 'add_product' %}" class="text-white text-decoration-none">Add Product</a>
            </li>
            <li class="px-4 py-2  rounded my-4" role="button">
              <a href="{% url 'product_page' %}" class="text-white text-decoration-none">Products</a>
            </li>
            <li class="px-4 py-2  rounded my-4" role="button">
              <a href="#" class="text-white text-decoration-none">Add Category</a>
            </li>
            <li class="px-4 py-2 rounded my-4" role="button">
              <a href="#" class="text-white text-decoration-none">Category</a>
            </li>

          </ul>
        </div>
        <div>
          <a href="#" class="btn btn-warning">Logout</a>
        </div>
    </aside>
      </div>
      <div class="col-md-10">
        <main>
        {% block main_content %}

        {% endblock %}
    </main>
      </div>

    </div>


    </div>


    <!-- bootstrap js cdn link -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
